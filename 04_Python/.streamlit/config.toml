# Aspecto del dashboard (solo tema nativo de Streamlit, sin CSS propio).
# Colores de la web de NOVA: tinta oscura y cobre, sobre fondo claro para leer bien las cifras.
[theme]
base = "light"
primaryColor = "#9b6343"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f0ea"
textColor = "#201e1d"
borderColor = "#e5dfdc"
headingFont = "serif"

# Variante oscura: solo se usa cuando el dashboard se ve dentro del panel de
# administracion (pagina «Analisis de datos», que lo abre con embed_options=dark_theme).
# Fondos y textos del panel de Alvaro; el cobre de la marca para los botones,
# porque con el texto blanco de los botones sigue cumpliendo el contraste AA.
[theme.dark]
primaryColor = "#9b6343"
backgroundColor = "#18181b"
secondaryBackgroundColor = "#0f0f10"
textColor = "#e7e7ea"
borderColor = "#2a2a2e"

[client]
# Sin el boton "Deploy": es un panel interno, no se publica en la nube
toolbarMode = "viewer"

[browser]
# No enviar estadisticas de uso a Streamlit
gatherUsageStats = false

[server]
# Solo se abre en este ordenador. Para verlo desde un movil de la misma red:
#   streamlit run app_dashboard.py --server.address 0.0.0.0
address = "localhost"
