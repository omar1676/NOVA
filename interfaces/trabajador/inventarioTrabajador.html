<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA Sneakers · Inventario</title>
    <link rel="icon" href="img/Nova Logo.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="adm">

<div class="adm-sidebar">
    <div class="adm-marca">
        <img src="img/Nova Logo.png" alt="NOVA Sneakers">
    </div>
    <nav class="adm-menu">
        <a href="trabajador.html"><i data-lucide="layout-dashboard"></i> Resumen</a>
        <a href="pedidosTrabajador.html"><i data-lucide="shopping-bag"></i> Pedidos</a>
        <a href="inventarioTrabajador.html" class="adm-activo"><i data-lucide="warehouse"></i> Inventario</a>
        <a href="personalizadosTrabajador.html"><i data-lucide="sparkles"></i> Personalizados</a>
        <a href="#" id="adm-salir"><i data-lucide="log-out"></i> Cerrar sesión</a>
    </nav>
</div>

<div class="adm-contenido">
    <h1>Inventario</h1>

    <div class="adm-herramientas">
        <input type="text" id="adm-buscador" placeholder="Buscar por nave, modelo, color, talla o SKU..." aria-label="Buscar por nave, modelo, color, talla o SKU">
        <select id="adm-filtro-estado" aria-label="Filtrar por estado del stock">
            <option value="">Todo el stock</option>
            <option value="suficiente">suficiente</option>
            <option value="bajo">bajo</option>
            <option value="agotado">agotado</option>
        </select>
    </div>

    <div class="adm-tabla-caja">
        <table class="adm-tabla">
            <thead>
                <tr>
                    <th>Nave</th>
                    <th>Modelo</th>
                    <th>Color</th>
                    <th>Talla</th>
                    <th>SKU</th>
                    <th>Estado</th>
                    <th>Cantidad</th>
                </tr>
            </thead>
            <tbody id="adm-inventario">
                <tr><td colspan="7" class="adm-vacio">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.62.0/dist/umd/lucide.min.js" integrity="sha384-KbBG+Cdzk6eN6IszNtkSQeU6IJq84TBpyLQN+W8Fn8y0QNsTNiB+j8vFW5Rn1SGZ" crossorigin="anonymous"></script>
<script src="script.js"></script>

</body>
</html>
