<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA Sneakers · Pedidos</title>
    <link rel="icon" href="img/Nova Logo.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="adm">

<div class="adm-sidebar">
    <div class="adm-marca">
        <img src="img/Nova Logo.png" alt="NOVA Sneakers">
    </div>
    <nav class="adm-menu">
        <a href="trabajador.html"><i data-lucide="layout-dashboard"></i> Resumen</a>
        <a href="pedidosTrabajador.html" class="adm-activo"><i data-lucide="shopping-bag"></i> Pedidos</a>
        <a href="inventarioTrabajador.html"><i data-lucide="warehouse"></i> Inventario</a>
        <a href="personalizadosTrabajador.html"><i data-lucide="sparkles"></i> Personalizados</a>
    </nav>
</div>

<div class="adm-contenido">
    <h1>Pedidos</h1>

    <div class="adm-herramientas">
        <input type="text" id="adm-buscador" placeholder="Buscar por referencia o cliente...">
        <select id="adm-filtro-estado">
            <option value="">Todos los estados</option>
            <option value="confirmado">confirmado</option>
            <option value="en_preparacion">en_preparacion</option>
            <option value="enviado">enviado</option>
            <option value="entregado">entregado</option>
        </select>
    </div>

    <div class="adm-tabla-caja">
        <table class="adm-tabla">
            <thead>
                <tr>
                    <th>Referencia</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Fecha objetivo</th>
                    <th>Estado</th>
                    <th>Total</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="adm-pedidos">
                <tr><td colspan="7" class="adm-vacio">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="script.js"></script>

</body>
</html>
