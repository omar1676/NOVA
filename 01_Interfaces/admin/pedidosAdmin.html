    <nav class="adm-menu">

        <a href="pedidosAdmin.html" class="adm-activo"><i data-lucide="shopping-bag"></i> Pedidos</a>

        <a href="trabajadoresAdmin.html"><i data-lucide="hard-hat"></i> Trabajadores</a>

<div class="adm-contenido">
    <h1>Pedidos</h1>

    <div class="adm-herramientas">
        <input type="text" id="adm-buscador" placeholder="Buscar por referencia o cliente..." aria-label="Buscar por referencia o cliente">
        <select id="adm-filtro-estado" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            <option value="pendiente">pendiente</option>
            <option>confirmado</option>
            <option value="en_preparacion">en_preparacion</option>
            <option value="enviado">enviado</option>
            <option value="entregado">entregado</option>
            <option value="cancelado">cancelado</option>
        </select>
    </div>

    <p class="adm-aviso adm-aviso-reparto" id="adm-aviso-reparto" role="status" tabindex="-1"></p>

    <div class="adm-tabla-caja">
        <table class="adm-tabla">
            <thead>
                <tr>
                    <th>Referencia</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Total</th>
                    <th>Reparto</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="6" class="adm-vacio">Cargando datos…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.62.0/dist/umd/lucide.min.js" integrity="sha384-KbBG+Cdzk6eN6IszNtkSQeU6IJq84TBpyLQN+W8Fn8y0QNsTNiB+j8vFW5Rn1SGZ" crossorigin="anonymous"></script>
